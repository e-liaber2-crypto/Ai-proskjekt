services:
  - type: web
    name: ai-proskjekt-demo
    runtime: docker
    plan: free
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
    envVars:
      - key: DEMO_PASSWORD
        generateValue: true
      - key: DATA_DIR
        value: /app/data
      - key: FFMPEG_THREADS
        value: "1"
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
